<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyTranslate V7</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
main{max-width:760px;margin:auto;padding:24px 16px 40px}
h1{margin:0 0 6px;font-size:30px}.sub{color:#647084;margin-bottom:22px}
.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
select,textarea,button{font:inherit}select{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:12px;background:white}
textarea{width:100%;min-height:180px;resize:vertical;border:1px solid #d7dce5;border-radius:12px;padding:14px;line-height:1.5}
button{border:0;border-radius:12px;padding:13px 16px;cursor:pointer}.primary{width:100%;background:#111827;color:white;font-weight:700;margin-top:10px}
.secondary{background:#eef1f6;color:#182235}.swap{flex:0 0 auto}
#status{margin-top:12px;color:#647084;font-size:14px;min-height:20px}
#out{background:#f8fafc;min-height:180px;white-space:pre-wrap}
.note{font-size:13px;color:#667085;line-height:1.45}
</style>
</head>
<body>
<main>
<h1>EasyTranslate</h1>
<div class="sub">V7 – iPhone-Test ohne lokales KI-Modell</div>

<div class="card">
  <div class="row">
    <select id="from"><option value="de">Deutsch</option><option value="en">English</option></select>
    <button class="secondary swap" id="swap" type="button">⇄</button>
    <select id="to"><option value="en">English</option><option value="de">Deutsch</option></select>
  </div>
</div>

<div class="card">
  <textarea id="input" placeholder="Text eingeben …">Hallo, wie geht es dir heute?</textarea>
  <button class="primary" id="translate">Übersetzen</button>
  <div id="status"></div>
</div>

<div class="card">
  <textarea id="out" readonly placeholder="Übersetzung …"></textarea>
  <button class="secondary" id="copy" type="button" style="margin-top:10px">Übersetzung kopieren</button>
</div>

<div class="card note">
  Diese Testversion verwendet kein KI-Modell auf dem iPhone. Die Übersetzung wird über einen externen kostenlosen Übersetzungsdienst angefragt. Dadurch sollte der bisherige Safari-Absturz durch die lokale Modellberechnung nicht mehr auftreten.
</div>

<script>
const $ = id => document.getElementById(id);

$("swap").onclick = () => {
  const a=$("from").value, b=$("to").value;
  $("from").value=b; $("to").value=a;
};

async function translatePart(text, from, to){
  const url = "https://api.mymemory.translated.net/get?q=" +
    encodeURIComponent(text) + "&langpair=" + encodeURIComponent(from+"|"+to);
  const r = await fetch(url, {method:"GET"});
  if(!r.ok) throw new Error("Übersetzungsdienst nicht erreichbar ("+r.status+")");
  const data = await r.json();
  if(data.responseStatus !== 200) throw new Error(data.responseDetails || "Übersetzung fehlgeschlagen");
  return data.responseData?.translatedText || "";
}

function splitText(text, max=450){
  const parts=[];
  let rest=text.trim();
  while(rest.length>max){
    let cut=rest.lastIndexOf("\n",max);
    if(cut<180) cut=rest.lastIndexOf(". ",max);
    if(cut<180) cut=rest.lastIndexOf(" ",max);
    if(cut<1) cut=max;
    parts.push(rest.slice(0,cut+1).trim());
    rest=rest.slice(cut+1).trim();
  }
  if(rest) parts.push(rest);
  return parts;
}

$("translate").onclick = async () => {
  const text=$("input").value.trim();
  if(!text){$("status").textContent="Bitte zuerst einen Text eingeben."; return;}
  const from=$("from").value, to=$("to").value;
  $("translate").disabled=true;
  $("out").value="";
  try{
    const parts=splitText(text);
    const result=[];
    for(let i=0;i<parts.length;i++){
      $("status").textContent=`Übersetze Abschnitt ${i+1} von ${parts.length} …`;
      result.push(await translatePart(parts[i],from,to));
    }
    $("out").value=result.join("\n\n");
    $("status").textContent="Fertig.";
  }catch(e){
    $("status").textContent="Fehler: "+e.message;
  }finally{$("translate").disabled=false;}
};

$("copy").onclick = async () => {
  try{
    await navigator.clipboard.writeText($("out").value);
    $("status").textContent="Übersetzung kopiert.";
  }catch(e){$("status").textContent="Kopieren nicht möglich.";}
};
</script>
</main>
</body>
</html>
