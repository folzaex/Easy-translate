<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyTranslate – iPhone Test</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:700px;margin:auto;padding:20px}textarea{width:100%;box-sizing:border-box;font-size:18px;padding:12px}button{font-size:18px;padding:12px 18px;margin-top:12px}#out{margin-top:20px;padding:14px;background:#f3f3f3;min-height:50px;border-radius:10px}.status{margin-top:12px;color:#555}</style></head>
<body><h1>EasyTranslate</h1><p><b>iPhone-Stabilitätstest</b> – nur Deutsch → Englisch</p>
<textarea id="in" rows="4">Hallo, wie geht es dir heute?</textarea><br><button id="go">Übersetzen</button>
<div class="status" id="status">Noch nicht geladen.</div><div id="out"></div>
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0';
env.allowLocalModels=false; env.useBrowserCache=true;
try{env.backends.onnx.wasm.numThreads=1;env.backends.onnx.wasm.simd=false;env.backends.onnx.wasm.proxy=false;}catch(e){}
let translator=null, busy=false;
async function run(){
 if(busy)return; busy=true; const b=document.getElementById('go'),s=document.getElementById('status'),o=document.getElementById('out');
 b.disabled=true;o.textContent='';s.textContent='Lade kleinen Test-Übersetzer…';
 try{
   translator ??= await pipeline('translation','Xenova/opus-mt-de-en',{device:'wasm',dtype:'q4'});
   s.textContent='Übersetze…';
   const r=await translator(document.getElementById('in').value,{max_new_tokens:96});
   o.textContent=Array.isArray(r)?r[0].translation_text:r.translation_text;
   s.textContent='Fertig.';
 }catch(e){console.error(e);s.textContent='Fehler: '+(e?.message||e);}
 finally{b.disabled=false;busy=false;}
}
document.getElementById('go').onclick=run;
</script></body></html>
